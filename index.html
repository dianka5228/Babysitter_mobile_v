"'+date+'" onchange="state.bookDate=this.value;render()"><div class="slots" style="margin-top:18px">'+hours.map(h=>'<button class="slot '+(isBusy(n.id,date,h)?'busy':'')+'" onclick="toggleSlot('+n.id+',\''+date+'\','+h+')">'+h+':00 '+(isBusy(n.id,date,h)?'Занято':'Свободно')+'</button>').join('')+'</div></div>'}function toggleSlot(id,date,h){if(db.bookings.some(b=>b.nannyId===id&&b.date===date&&!['Отменено','Отклонено'].includes(b.status)&&h>=b.start&&h<b.start+b.duration))return toast('Интервал занят заявкой');let k=key(id,date,h);db.slots[k]=db.slots[k]==='busy'?'free':'busy';save();render()}function nannyRequests(){let n=officeNanny(),a=db.bookings.filter(b=>b.nannyId===n.id);return '<h1>Заявки няне</h1><p>'+esc(n.name)+'</p>'+(a.map(b=>'<div class="panel" style="margin:9px 0"><b>№'+b.id+'</b> · '+b.date+' '+b.start+':00 · '+b.duration+' ч <span class="badge">'+b.status+'</span><p>'+esc(b.notes)+'</p>'+(['Ожидает подтверждения няни','Подтверждено'].includes(b.status)?'<button class="primary" onclick="changeBooking('+b.id+',\''+(b.status==='Подтверждено'?'Завершено':'Подтверждено')+'\')">'+(b.status==='Подтверждено'?'Завершить':'Подтвердить')+'</button> ':'')+(b.status==='Ожидает подтверждения няни'?'<button onclick="changeBooking('+b.id+',\'Отклонено\')">Отклонить</button>':'')+'</div>').join('')||'<div class="empty">Нет заявок. Создайте бронирование у Анны Смирновой (первая няня каталога).</div>')}function adminPage(){let n=db.nannies;return '<h1>Административная аналитика</h1><div class="notice">Демонстрационные показатели и переключение ролей. Не является настоящей системой разграничения прав.</div><div class="stats">'+[['Всего анкет',n.length],['На модерации',n.filter(x=>x.moderation==='Ожидает модерации').length],['Проверка пройдена',n.filter(x=>x.checked==='Пройдена').length],['Активные заявки',db.bookings.filter(x=>!['Отменено','Отклонено','Завершено'].includes(x.status)).length],['Отзывы',n.reduce((a,x)=>a+x.reviews.length,0)],['Демо-пользователи',86],['Новые анкеты',n.filter(x=>x.owner).length]].map(([a,b])=>'<div class="stat"><strong>'+b+'</strong><small>'+a+'</small></div>').join('')+'</div><div class="grid2" style="margin-top:20px">'+[['По городам','cityChart'],['Стоимость часа','priceChart'],['Статусы проверки','checkChart'],['Бронирования по месяцам','monthChart'],['Возрастные категории','ageChart']].map(([a,id])=>'<div class="panel"><h3>'+a+'</h3><canvas id="'+id+'" class="chart"></canvas></div>').join('')+'</div>'}let charts=[];function drawCharts(){charts.forEach(c=>c.destroy());charts=[];if(!window.Chart){document.querySelectorAll('canvas').forEach(c=>c.replaceWith(Object.assign(document.createElement('p'),{textContent:'Графики требуют подключения к интернету (Chart.js).'})));return}function chart(id,type,labels,data){let el=document.getElementById(id);if(el)charts.push(new Chart(el,{type,data:{labels,datasets:[{label:'Количество',data,backgroundColor:['#0b87c5','#37bca8','#72a5dc','#a4d4e2','#72cbb7']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type==='doughnut'}}}}))}let ns=db.nannies;chart('cityChart','bar',Object.keys(cities),Object.keys(cities).map(c=>ns.filter(n=>n.city===c).length));chart('priceChart','bar',['до 600','600–900','900–1200','1200+'],[ns.filter(n=>n.price<600).length,ns.filter(n=>n.price>=600&&n.price<900).length,ns.filter(n=>n.price>=900&&n.price<1200).length,ns.filter(n=>n.price>=1200).length]);chart('checkChart','doughnut',['Пройдена','В процессе','Не проводилась'],['Пройдена','В процессе','Не проводилась'].map(s=>ns.filter(n=>n.checked===s).length));let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});chart('monthChart','line',months,months.map(m=>db.bookings.filter(b=>b.date.startsWith(m)).length));chart('ageChart','bar',ages,ages.map(a=>ns.reduce((sum,n)=>sum+n.reviews.filter(r=>r.childAge===a).length,0)))}function moderation(){let a=db.nannies.filter(n=>n.moderation!=='Одобрена');return '<h1>Модерация анкет</h1><div class="tablewrap"><table><tr><th>Няня</th><th>Город</th><th>Статус</th><th>Действия</th></tr>'+a.map(n=>'<tr><td>'+esc(n.name)+'</td><td>'+esc(n.city)+'</td><td>'+n.moderation+'</td><td><button onclick="moderate('+n.id+',\'Одобрена\')">Одобрить</button> <button onclick="moderate('+n.id+',\'Отклонена\')">Отклонить</button> <button onclick="moderate('+n.id+',\'На доработке\')">На доработку</button></td></tr>').join('')+'</table></div>'+(a.length?'':'<div class="empty">Нет анкет на модерации. Добавьте новую через форму сотрудника.</div>')}function moderate(id,status){let n=db.nannies.find(n=>n.id===id);n.moderation=status;if(status==='Одобрена'&&n.checked!=='Пройдена')notify('Анкета одобрена, но появится в каталоге только после проверки');save();notify('Статус модерации: '+status);render()}function checks(){return '<h1>Внутренняя проверка анкет</h1><div class="notice">Статус меняется только в демонстрационном режиме администратора, независимо от модерации анкеты. Проверка в реальности не выполняется.</div><div class="tablewrap"><table><tr><th>Няня</th><th>Модерация</th><th>Статус проверки</th></tr>'+db.nannies.map(n=>'<tr><td>'+esc(n.name)+'</td><td>'+n.moderation+'</td><td><select onchange="nannyCheck('+n.id+',this.value)">'+['Пройдена','В процессе','Не проводилась'].map(s=>'<option '+(s===n.checked?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</table></div>'}function nannyCheck(id,v){if(state.role!=='Администратор')return toast('Недоступно');db.nannies.find(n=>n.id===id).checked=v;save();notify('Демо-статус проверки обновлён')}function resetDemo(){if(!confirm('Удалить все изменения демоданных и восстановить исходный каталог?'))return;db=structuredClone(initial);save();state.page='home';state.role='Сотрудник';state.form={};state.wizard=0;render();toast('Демоданные восстановлены')}render();
</script></body></html>
